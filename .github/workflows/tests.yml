name: Async Task Manager Tests

on:
  push:
    branches:
      - async_main
      - refactor-async-main
  pull_request:
    branches:
      - async_main
      - refactor-async-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-change-me
      WEATHER_API_KEY: ci-test-weather-key
      DATABASE_URL: sqlite+aiosqlite:///./ci_tasks.db
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest-cov>=6,<8"

      - name: Run test suite with coverage
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml
